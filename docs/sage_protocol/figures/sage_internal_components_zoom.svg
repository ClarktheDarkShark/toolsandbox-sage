<text x="1634" y="193" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#a13a3a">Safety</text>
<text x="1634" y="231" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#536178">Side-effect-free</text>
<text x="1634" y="254" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#536178">helpers. Explicit</text>
<text x="1634" y="277" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#536178">original action</text>
<text x="1634" y="300" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#536178">follow-up.</text>
<text x="1634" y="323" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#536178">Runtime and</text>
<text x="1634" y="346" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#536178">helper incidents</text>
<text x="1634" y="369" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#536178">must remain zero.</text>
<rect x="1610" y="480" width="230" height="230" rx="18" fill="#eef2f7" stroke="#9aa8bd" stroke-width="2"/>
<text x="1634" y="523" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#172033">Cache Policy</text>
<text x="1634" y="561" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#536178">Controls can be</text>
<text x="1634" y="584" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#536178">cached task-by-</text>
<text x="1634" y="607" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#536178">task.</text>
<text x="1634" y="630" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#536178">SAGE/candidate</text>
<text x="1634" y="653" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#536178">task evidence is</text>
<text x="1634" y="676" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#536178">fresh.</text>
<rect x="1610" y="770" width="230" height="210" rx="18" fill="#eef2f7" stroke="#9aa8bd" stroke-width="2"/>
<text x="1634" y="813" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#172033">Metrics</text>
<text x="1634" y="851" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#536178">Outcome primary.</text>
<text x="1634" y="874" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#536178">Canonical</text>
<text x="1634" y="897" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#536178">secondary. Exact</text>
<text x="1634" y="920" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#536178">success and</text>
<text x="1634" y="943" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#536178">contribution are</text>
<text x="1634" y="966" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#536178">explanatory.</text>
