<text x="80" y="954" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#172033">Figure caption draft:</text>
<text x="80" y="991" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#172033">SAGE is evaluated as a matched ToolSandbox treatment. Baseline and SAGE arms share a sealed manifest and model policy. Controls may use transparent</text>
<text x="80" y="1017" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#172033">task-level cache; SAGE/candidate evidence is fresh. Tool generation, validation, routing, and reflection are bounded by safety and leakage controls</text>
<text x="80" y="1043" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#172033">before paired outcome and canonical analyses.</text>
