<text x="294" y="764" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#536178">Zero helper side-effect</text>
<text x="294" y="787" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#536178">incidents</text>
<text x="294" y="810" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#536178">No force-call promotion</text>
<text x="294" y="833" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#536178">evidence</text>
