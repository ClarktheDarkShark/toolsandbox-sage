<text x="80" y="1408" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#142033">Caption draft: SAGE is evaluated as a matched ToolSandbox treatment with a sealed manifest, fresh same-run control and SAGE arms, bounded generated-tool routing, safety/leakage gates, and paired statistical analysis.</text>
<text x="80" y="1430" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#142033">Outcome/task completion is the sole performance endpoint; canonical/reference similarity is descriptive only.</text>
