<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1050" viewBox="0 0 1800 1050">
<defs><marker id="line-arrow" markerWidth="10" markerHeight="10" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 Z" fill="#9aa7b7"/></marker><marker id="blue-arrow" markerWidth="10" markerHeight="10" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2563eb"/></marker><marker id="green-arrow" markerWidth="10" markerHeight="10" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 Z" fill="#059669"/></marker><marker id="amber-arrow" markerWidth="10" markerHeight="10" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 Z" fill="#d97706"/></marker><marker id="red-arrow" markerWidth="10" markerHeight="10" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 Z" fill="#dc2626"/></marker><marker id="violet-arrow" markerWidth="10" markerHeight="10" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 Z" fill="#7c3aed"/></marker><marker id="slate-arrow" markerWidth="10" markerHeight="10" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 Z" fill="#64748b"/></marker></defs>
<style>
text {
  font-family: Arial, Helvetica, sans-serif;
  fill: #172033;
}
.caption { font-size: 18px; fill: #596579; }
.panelLetter { font-size: 19px; font-weight: 700; fill: #ffffff; }
.panelTitle { font-size: 24px; font-weight: 700; }
.moduleTitle { font-size: 22px; font-weight: 700; }
.moduleText { font-size: 17px; fill: #596579; }
.small { font-size: 15px; fill: #596579; }
.tiny { font-size: 13px; fill: #596579; }
.axis { font-size: 14px; fill: #596579; }
.metric { font-size: 18px; font-weight: 700; }
.num { font-size: 15px; font-weight: 700; fill: #ffffff; }
</style>
<rect width="1800" height="1050" fill="#ffffff"/>
<rect x="0" y="0" width="1800" height="8" fill="#2563eb"/>
<text class="caption" x="92" y="48">SAGE Evidence Boundary</text>
<circle cx="105" cy="92" r="17" fill="#2563eb"/><text class="panelLetter" x="105" y="98" text-anchor="middle">A</text><text class="panelTitle" x="135" y="100">Claim Ladder</text><rect x="130" y="185" width="235" height="118" rx="8" fill="#f4f7fb" stroke="#64748b" stroke-width="1.5"/><circle cx="165" cy="226" r="20" fill="#64748b"/><text class="num" x="165" y="231" text-anchor="middle">1</text><text class="moduleTitle" x="195" y="225">Diagnostics</text><text class="moduleText" x="195" y="255">repair/setup only</text><line x1="365" y1="244" x2="430" y2="244" stroke="#9aa7b7" stroke-width="2.2" stroke-linecap="round" marker-end="url(#line-arrow)"/><rect x="430" y="185" width="235" height="118" rx="8" fill="#fff7e6" stroke="#d97706" stroke-width="1.5"/><circle cx="465" cy="226" r="20" fill="#d97706"/><text class="num" x="465" y="231" text-anchor="middle">2</text><text class="moduleTitle" x="495" y="225">20 / 60</text><text class="moduleText" x="495" y="255">mechanism check</text><line x1="665" y1="244" x2="730" y2="244" stroke="#9aa7b7" stroke-width="2.2" stroke-linecap="round" marker-end="url(#line-arrow)"/><rect x="730" y="185" width="235" height="118" rx="8" fill="#edf5ff" stroke="#2563eb" stroke-width="1.5"/><circle cx="765" cy="226" r="20" fill="#2563eb"/><text class="num" x="765" y="231" text-anchor="middle">3</text><text class="moduleTitle" x="795" y="225">250 / 500</text><text class="moduleText" x="795" y="255">paired validation</text><line x1="965" y1="244" x2="1030" y2="244" stroke="#9aa7b7" stroke-width="2.2" stroke-linecap="round" marker-end="url(#line-arrow)"/><rect x="1030" y="185" width="235" height="118" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/><circle cx="1065" cy="226" r="20" fill="#059669"/><text class="num" x="1065" y="231" text-anchor="middle">4</text><text class="moduleTitle" x="1095" y="225">Frozen reuse</text><text class="moduleText" x="1095" y="255">generation off</text><line x1="1265" y1="244" x2="1330" y2="244" stroke="#9aa7b7" stroke-width="2.2" stroke-linecap="round" marker-end="url(#line-arrow)"/><rect x="1330" y="185" width="235" height="118" rx="8" fill="#f5f1ff" stroke="#7c3aed" stroke-width="1.5"/><circle cx="1365" cy="226" r="20" fill="#7c3aed"/><text class="num" x="1365" y="231" text-anchor="middle">5</text><text class="moduleTitle" x="1395" y="225">Protected claim</text><text class="moduleText" x="1395" y="255">locked protocol</text><circle cx="105" cy="432" r="17" fill="#059669"/><text class="panelLetter" x="105" y="438" text-anchor="middle">B</text><text class="panelTitle" x="135" y="440">Evidence Controls</text><rect x="120" y="485" width="1450" height="310" rx="10" fill="#fbfdff" stroke="#d8e0ea" stroke-width="1.5"/><circle cx="160" cy="540" r="12" fill="#dc2626"/><path d="M154 540 L159 545 L168 533" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text class="moduleTitle" x="184" y="547">No hidden answers</text><text class="moduleText" x="184" y="574"><tspan x="184" dy="0">Generated tools cannot encode expected</tspan><tspan x="184" dy="20">answers, hidden labels, or scenario IDs.</tspan></text><circle cx="160" cy="625" r="12" fill="#dc2626"/><path d="M154 625 L159 630 L168 618" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text class="moduleTitle" x="184" y="632">No synthetic task completion</text><text class="moduleText" x="184" y="659"><tspan x="184" dy="0">Evidence excludes code-side completions and</tspan><tspan x="184" dy="20">route-around shortcuts.</tspan></text><circle cx="160" cy="710" r="12" fill="#2563eb"/><path d="M154 710 L159 715 L168 703" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text class="moduleTitle" x="184" y="717">Fresh SAGE arm</text><text class="moduleText" x="184" y="744"><tspan x="184" dy="0">SAGE task cache off and response cache</tspan><tspan x="184" dy="20">disabled for evidence runs.</tspan></text><circle cx="860" cy="540" r="12" fill="#d97706"/><path d="M854 540 L859 545 L868 533" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text class="moduleTitle" x="884" y="547">Control provenance recorded</text><text class="moduleText" x="884" y="574"><tspan x="884" dy="0">Baseline cache source and cached/fresh</tspan><tspan x="884" dy="20">counts remain visible.</tspan></text><circle cx="860" cy="625" r="12" fill="#059669"/><path d="M854 625 L859 630 L868 618" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text class="moduleTitle" x="884" y="632">Natural tool calls only</text><text class="moduleText" x="884" y="659"><tspan x="884" dy="0">Forced generated-tool calls are diagnostic</tspan><tspan x="884" dy="20">and excluded from adoption claims.</tspan></text><circle cx="860" cy="710" r="12" fill="#059669"/><path d="M854 710 L859 715 L868 703" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text class="moduleTitle" x="884" y="717">Safety reported</text><text class="moduleText" x="884" y="744"><tspan x="884" dy="0">Runtime exceptions, tool failures, and side-</tspan><tspan x="884" dy="20">effect incidents are logged.</tspan></text><circle cx="105" cy="877" r="17" fill="#7c3aed"/><text class="panelLetter" x="105" y="883" text-anchor="middle">C</text><text class="panelTitle" x="135" y="885">Protected Interpretation</text><text class="moduleText" x="155" y="930">A result supports Chapter 3 only when accuracy, natural generated-tool use, cache provenance, and safety evidence are all visible.</text>
</svg>
