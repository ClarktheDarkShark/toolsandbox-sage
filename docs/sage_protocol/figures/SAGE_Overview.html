<text class="caption" x="92" y="48">SAGE Overview</text>
<circle cx="95" cy="92" r="17" fill="#2563eb"/><text class="panelLetter" x="95" y="98" text-anchor="middle">A</text><text class="panelTitle" x="125" y="100">What Changes</text><rect x="95" y="135" width="300" height="130" rx="8" fill="#f4f7fb" stroke="#64748b" stroke-width="1.6"/><rect x="95" y="135" width="7" height="130" rx="3.5" fill="#64748b"/><text class="moduleTitle" x="115" y="166">Frozen LLM actor</text><text class="moduleText" x="115" y="209"><tspan x="115" dy="0">Model weights remain</tspan><tspan x="115" dy="21">unchanged.</tspan></text><rect x="95" y="305" width="300" height="130" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/><rect x="95" y="305" width="7" height="130" rx="3.5" fill="#059669"/><text class="moduleTitle" x="115" y="336">Tool portfolio</text><text class="moduleText" x="115" y="379"><tspan x="115" dy="0">Generated tools are added,</tspan><tspan x="115" dy="21">retained, routed, and reused.</tspan></text><line x1="245" y1="265" x2="245" y2="305" stroke="#059669" stroke-width="2.2" stroke-linecap="round" marker-end="url(#green-arrow)"/><circle cx="500" cy="92" r="17" fill="#7c3aed"/><text class="panelLetter" x="500" y="98" text-anchor="middle">B</text><text class="panelTitle" x="530" y="100">Online Build Loop</text><rect x="500" y="150" width="210" height="105" rx="8" fill="#edf5ff" stroke="#2563eb" stroke-width="1.6"/><rect x="500" y="150" width="7" height="105" rx="3.5" fill="#2563eb"/><text class="moduleTitle" x="520" y="181">Task attempt</text><text class="moduleText" x="520" y="224"><tspan x="520" dy="0">Actor uses original and</tspan><tspan x="520" dy="21">routed tools.</tspan></text><rect x="790" y="150" width="210" height="105" rx="8" fill="#fff7e6" stroke="#d97706" stroke-width="1.6"/><rect x="790" y="150" width="7" height="105" rx="3.5" fill="#d97706"/><text class="moduleTitle" x="810" y="181">Gap evidence</text><text class="moduleText" x="810" y="224"><tspan x="810" dy="0">Reusable deterministic</tspan><tspan x="810" dy="21">operation.</tspan></text><rect x="1080" y="150" width="210" height="105" rx="8" fill="#f5f1ff" stroke="#7c3aed" stroke-width="1.6"/><rect x="1080" y="150" width="7" height="105" rx="3.5" fill="#7c3aed"/><text class="moduleTitle" x="1100" y="181">Generate tool</text><text class="moduleText" x="1100" y="224"><tspan x="1100" dy="0">Typed code and schema.</tspan></text><rect x="1370" y="150" width="230" height="105" rx="8" fill="#fff1f1" stroke="#dc2626" stroke-width="1.6"/><rect x="1370" y="150" width="7" height="105" rx="3.5" fill="#dc2626"/><text class="moduleTitle" x="1390" y="181">Validate</text><text class="moduleText" x="1390" y="224"><tspan x="1390" dy="0">Compile, call, safety.</tspan></text><rect x="1080" y="390" width="245" height="105" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/><rect x="1080" y="390" width="7" height="105" rx="3.5" fill="#059669"/><text class="moduleTitle" x="1100" y="421">Registry entry</text><text class="moduleText" x="1100" y="464"><tspan x="1100" dy="0">Hash, metadata, status.</tspan></text><rect x="790" y="390" width="210" height="105" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/><rect x="790" y="390" width="7" height="105" rx="3.5" fill="#059669"/><text class="moduleTitle" x="810" y="421">Route later</text><text class="moduleText" x="810" y="464"><tspan x="810" dy="0">Small relevant bundle.</tspan></text><rect x="500" y="390" width="210" height="105" rx="8" fill="#edf5ff" stroke="#2563eb" stroke-width="1.6"/><rect x="500" y="390" width="7" height="105" rx="3.5" fill="#2563eb"/><text class="moduleTitle" x="520" y="421">Reuse</text><text class="moduleText" x="520" y="464"><tspan x="520" dy="0">Natural actor calls.</tspan></text><line x1="710" y1="202" x2="790" y2="202" stroke="#9aa7b7" stroke-width="2.2" stroke-linecap="round" marker-end="url(#line-arrow)"/><line x1="1000" y1="202" x2="1080" y2="202" stroke="#9aa7b7" stroke-width="2.2" stroke-linecap="round" marker-end="url(#line-arrow)"/><line x1="1290" y1="202" x2="1370" y2="202" stroke="#9aa7b7" stroke-width="2.2" stroke-linecap="round" marker-end="url(#line-arrow)"/><path d="M1485 255 L1485 338 L1220 338 L1220 390" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#green-arrow)"/><line x1="1080" y1="442" x2="1000" y2="442" stroke="#059669" stroke-width="2.2" stroke-linecap="round" marker-end="url(#green-arrow)"/><line x1="790" y1="442" x2="710" y2="442" stroke="#059669" stroke-width="2.2" stroke-linecap="round" marker-end="url(#green-arrow)"/><path d="M500 442 L455 442 L455 202 L500 202" fill="none" stroke="#2563eb" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 7" marker-end="url(#blue-arrow)"/><path d="M1485 255 L1485 292 L1190 292 L1190 255" fill="none" stroke="#dc2626" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 7" marker-end="url(#red-arrow)"/><text class="small" x="1210" y="286" fill="#dc2626">repair when validation fails</text><circle cx="95" cy="642" r="17" fill="#059669"/><text class="panelLetter" x="95" y="648" text-anchor="middle">C</text><text class="panelTitle" x="125" y="650">Boundary and Evidence</text><rect x="95" y="690" width="1510" height="250" rx="8" fill="#fbfdff" stroke="#d8e0ea" stroke-width="1.5"/><circle cx="130" cy="745" r="12" fill="#059669"/><path d="M124 745 L129 750 L138 738" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text class="moduleTitle" x="154" y="752">Original environment tools execute state changes</text><text class="moduleText" x="154" y="779"><tspan x="154" dy="0">Generated tools prepare, select, normalize,</tspan><tspan x="154" dy="20">plan, or abstain.</tspan></text><circle cx="810" cy="745" r="12" fill="#2563eb"/><path d="M804 745 L809 750 L818 738" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text class="moduleTitle" x="834" y="752">Evidence is task-level and paired</text><text class="moduleText" x="834" y="779"><tspan x="834" dy="0">Visibility, natural calls, gains,</tspan><tspan x="834" dy="20">regressions, failures, and side effects are</tspan><tspan x="834" dy="20">logged.</tspan></text><circle cx="130" cy="850" r="12" fill="#dc2626"/><path d="M124 850 L129 855 L138 843" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text class="moduleTitle" x="154" y="857">No answer leakage or synthetic completion</text><text class="moduleText" x="154" y="884"><tspan x="154" dy="0">Tools must not encode hidden labels,</tspan><tspan x="154" dy="20">expected answers, scenario IDs, or code-side</tspan><tspan x="154" dy="20">task completions.</tspan></text>
