<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1160" viewBox="0 0 1900 1160">
<defs>
<marker id="arrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="strokeWidth"><path d="M 0 0 L 14 7 L 0 14 z" fill="#536178"/></marker>
</defs>
<rect x="0" y="0" width="1900" height="1160" rx="0" fill="#f7f9fc" stroke="none" stroke-width="2"/>
<text x="60" y="82" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#172033">1. SAGE + ToolSandbox End-to-End System</text>
<rect x="60" y="130" width="390" height="230" rx="18" fill="#e5f0fb" stroke="#245f9f" stroke-width="2"/>
<text x="84" y="173" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#172033">Sealed Task Cohort</text>
<text x="84" y="211" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#536178">Manifest-defined scenario order,</text>
<text x="84" y="234" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#536178">split protocol, family diversity</text>
<text x="84" y="257" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#536178">checks, and no label peeking</text>
<text x="84" y="280" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#536178">before unseen runs.</text>
<rect x="60" y="410" width="390" height="210" rx="18" fill="#eef2f7" stroke="#9aa8bd" stroke-width="2"/>
<text x="84" y="453" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#172033">Control Baseline</text>
<text x="84" y="491" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#536178">Base ToolSandbox tools. Eligible</text>
<text x="84" y="514" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#536178">controls may use task-level</text>
<text x="84" y="537" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#536178">baseline cache with fresh/cached</text>
<text x="84" y="560" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#536178">counts and hash recorded.</text>
<rect x="60" y="680" width="390" height="230" rx="18" fill="#dff3ef" stroke="#1f7a6d" stroke-width="2"/>
<text x="84" y="723" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#172033">SAGE Candidate</text>
<text x="84" y="761" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#536178">Fresh candidate arm. Generation</text>
<text x="84" y="784" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#536178">on for discovery, off for frozen</text>
<text x="84" y="807" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#536178">validation. Candidate task cache</text>
<text x="84" y="830" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#536178">remains off.</text>
<rect x="560" y="210" width="360" height="230" rx="18" fill="#ffffff" stroke="#9aa8bd" stroke-width="2"/>
<text x="584" y="253" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#172033">ToolSandbox Environment</text>
<text x="584" y="291" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#536178">Stateful tools, user</text>
<text x="584" y="314" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#536178">simulator, execution context, </text>
<text x="584" y="337" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#536178">phone/contact/reminder/message</text>
<text x="584" y="360" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#536178">/device state, and scenario</text>
<text x="584" y="383" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#536178">scorer.</text>
<rect x="560" y="560" width="360" height="230" rx="18" fill="#fff3d8" stroke="#9a6a05" stroke-width="2"/>
<text x="584" y="603" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#172033">Original Tool Calls</text>
<text x="584" y="641" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#536178">SAGE helpers never replace</text>
<text x="584" y="664" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#536178">required side-effect tools.</text>
<text x="584" y="687" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#536178">They prepare deterministic</text>
<text x="584" y="710" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#536178">values, selections, or next-</text>
<text x="584" y="733" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#536178">call arguments.</text>
<rect x="1030" y="120" width="390" height="210" rx="18" fill="#dff3ef" stroke="#1f7a6d" stroke-width="2"/>
<text x="1054" y="163" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#172033">SAGE Runtime</text>
<text x="1054" y="201" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#536178">Gap observer, live tool</text>
<text x="1054" y="224" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#536178">generation, validation, registry,</text>
<text x="1054" y="247" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#536178">bounded router, actor bridge</text>
<text x="1054" y="270" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#536178">policy, and lifecycle reflection.</text>
<rect x="1030" y="410" width="390" height="220" rx="18" fill="#e5f0fb" stroke="#245f9f" stroke-width="2"/>
<text x="1054" y="453" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#172033">Matched Scoring</text>
<text x="1054" y="491" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#536178">Paired scenario-level</text>
<text x="1054" y="514" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#536178">canonical/reference score,</text>
<text x="1054" y="537" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#536178">primary outcome score, exact</text>
<text x="1054" y="560" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#536178">success, gains, regressions, and</text>
<text x="1054" y="583" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#536178">preserved counts.</text>
<rect x="1030" y="710" width="390" height="220" rx="18" fill="#ffffff" stroke="#9aa8bd" stroke-width="2"/>
<text x="1054" y="753" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#172033">Contribution Evidence</text>
<text x="1054" y="791" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#536178">Visible/called/VNC, called-subset</text>
<text x="1054" y="814" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#536178">deltas, generated-tool births,</text>
<text x="1054" y="837" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#536178">helper failures, side-effect</text>
<text x="1054" y="860" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#536178">preservation, and route mismatch.</text>
<rect x="1510" y="260" width="320" height="220" rx="18" fill="#ffffff" stroke="#9aa8bd" stroke-width="2"/>
<text x="1534" y="303" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#172033">Dashboards</text>
<text x="1534" y="341" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#536178">Task Compare, Task Focus,</text>
<text x="1534" y="364" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#536178">run progress, task</text>
<text x="1534" y="387" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#536178">details, full transaction</text>
<text x="1534" y="410" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#536178">traces, generated tool</text>
<text x="1534" y="433" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#536178">events, and outcome lift.</text>
<rect x="1510" y="590" width="320" height="220" rx="18" fill="#ffffff" stroke="#9aa8bd" stroke-width="2"/>
<text x="1534" y="633" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#172033">Reports + Artifacts</text>
<text x="1534" y="671" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#536178">Run ledger, current state,</text>
<text x="1534" y="694" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#536178">registry manifests,</text>
<text x="1534" y="717" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#536178">hashes, summaries,</text>
<text x="1534" y="740" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#536178">statistics, and</text>
<text x="1534" y="763" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#536178">methodology assets.</text>
<line x1="450" y1="245" x2="560" y2="245" stroke="#536178" stroke-width="4" marker-end="url(#arrow)"/>
<line x1="450" y1="515" x2="560" y2="515" stroke="#536178" stroke-width="4" marker-end="url(#arrow)"/>
<line x1="450" y1="795" x2="560" y2="795" stroke="#536178" stroke-width="4" marker-end="url(#arrow)"/>
<line x1="920" y1="325" x2="1030" y2="225" stroke="#536178" stroke-width="4" marker-end="url(#arrow)"/>
<line x1="920" y1="675" x2="1030" y2="520" stroke="#536178" stroke-width="4" marker-end="url(#arrow)"/>
<line x1="1420" y1="520" x2="1510" y2="370" stroke="#536178" stroke-width="4" marker-end="url(#arrow)"/>
<line x1="1420" y1="820" x2="1510" y2="700" stroke="#536178" stroke-width="4" marker-end="url(#arrow)"/>
<line x1="1225" y1="710" x2="1225" y2="630" stroke="#536178" stroke-width="4" marker-end="url(#arrow)"/>
<line x1="1225" y1="330" x2="1225" y2="410" stroke="#536178" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="60" y="980" width="1770" height="110" rx="18" fill="#fdeaea" stroke="#a13a3a" stroke-width="2"/>
<text x="90" y="1028" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#a13a3a">Research Guardrails</text>
<text x="90" y="1062" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#172033">No hidden labels, no expected-answer leakage, no scenario-specific hard-coding, no force-call promotion evidence, no candidate task cache, and zero helper</text>
<text x="90" y="1087" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#172033">side-effect incidents for claim candidates.</text>
</svg>
