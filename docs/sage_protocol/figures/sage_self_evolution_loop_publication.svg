<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1500" viewBox="0 0 2400 1500" role="img" aria-labelledby="title desc">
<title id="title">SAGE generated-tool self-evolution loop</title>
<desc id="desc">A clockwise flywheel diagram shows five SAGE phases around a central validated tool inventory: observe visible gap, birth candidate tool, validate before use, register and route a bounded bundle, and use and learn from actor evidence. A lower governance band branches lifecycle reflection into retain, repair, or suppress decisions.</desc>

<defs>
  <filter id="softShadow" x="-12%" y="-18%" width="124%" height="140%">
    <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#334155" flood-opacity="0.12"/>
  </filter>
  <filter id="hubGlow" x="-18%" y="-24%" width="136%" height="150%">
    <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#059669" flood-opacity="0.18"/>
  </filter>
  <marker id="blue-arrow" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L18,9 L0,18 Z" fill="#2563eb"/></marker><marker id="green-arrow" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L18,9 L0,18 Z" fill="#059669"/></marker><marker id="amber-arrow" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L18,9 L0,18 Z" fill="#d97706"/></marker><marker id="violet-arrow" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L18,9 L0,18 Z" fill="#7c3aed"/></marker><marker id="red-arrow" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L18,9 L0,18 Z" fill="#dc2626"/></marker><marker id="slate-arrow" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L18,9 L0,18 Z" fill="#64748b"/></marker>
</defs>

<style>
text {
  font-family: Arial, Helvetica, sans-serif;
  letter-spacing: 0;
  fill: #111827;
}
.title { font-size: 42px; font-weight: 800; }
.subtitle { font-size: 21px; fill: #5b6678; }
.eyebrow { font-size: 15px; font-weight: 800; letter-spacing: 1.1px; }
.nodeTitle { font-size: 23px; font-weight: 800; }
.nodeBody { font-size: 17px; fill: #5b6678; }
.hubTitle { font-size: 30px; font-weight: 800; }
.hubBody { font-size: 18px; fill: #5b6678; }
.num { font-size: 22px; font-weight: 800; fill: #ffffff; }
.small { font-size: 15px; fill: #5b6678; }
.badge { font-size: 15px; font-weight: 800; }
.footerStrong { font-size: 16px; font-weight: 800; fill: #ffffff; }
.footerText { font-size: 16px; fill: #dbe7f1; }
</style>
<rect x="0" y="0" width="2400" height="1500" rx="0" fill="#f5f8fb"/><rect x="60" y="44" width="2280" height="1400" rx="26" fill="#ffffff" stroke="#d9e2ec" stroke-width="1.5"/><text class="title" x="110" y="105">SAGE Generated-Tool Self-Evolution Loop</text><text class="subtitle" x="110" y="142"><tspan x="110" dy="0">A governed flywheel: visible task context reveals an inadequacy, SAGE births and validates a generated tool, routes accepted tools</tspan><tspan x="110" dy="26">for natural actor use, and updates lifecycle state from reuse evidence.</tspan></text><rect x="100" y="205" width="2200" height="770" rx="24" fill="#fbfdff" stroke="#9aa7b7" stroke-width="1.3" stroke-dasharray="10 10"/><rect x="130" y="188" width="330" height="38" rx="19" fill="#ffffff" stroke="#9aa7b7" stroke-width="1"/><text class="eyebrow" x="158" y="214" fill="#64748b">CLAIM-COUNTED RUNTIME</text><ellipse cx="1110" cy="620" rx="760" ry="405" fill="none" stroke="#dbe7f1" stroke-width="20" opacity="0.85"/><rect x="170" y="520" width="360" height="155" rx="18" fill="#ffffff" stroke="#2563eb" stroke-width="2" filter="url(#softShadow)"/><rect x="170" y="520" width="360" height="54" rx="18" fill="#eaf3ff"/><rect x="170" y="520" width="8" height="155" rx="4" fill="#2563eb"/><circle cx="214" cy="562" r="28" fill="#2563eb"/><text class="num" x="214" y="570" text-anchor="middle">1</text><text class="eyebrow" x="256" y="550" fill="#2563eb">OBSERVE</text><text class="nodeTitle" x="256" y="578"><tspan x="256" dy="0">Visible gap</tspan></text><text class="nodeBody" x="202" y="624"><tspan x="202" dy="0">Task text, state, traces, and</tspan><tspan x="202" dy="22">native tool affordances reveal an</tspan><tspan x="202" dy="22">inadequacy.</tspan></text><rect x="575" y="290" width="360" height="155" rx="18" fill="#ffffff" stroke="#059669" stroke-width="2" filter="url(#softShadow)"/><rect x="575" y="290" width="360" height="54" rx="18" fill="#e8f8f1"/><rect x="575" y="290" width="8" height="155" rx="4" fill="#059669"/><circle cx="619" cy="332" r="28" fill="#059669"/><text class="num" x="619" y="340" text-anchor="middle">2</text><text class="eyebrow" x="661" y="320" fill="#059669">BIRTH</text><text class="nodeTitle" x="661" y="348"><tspan x="661" dy="0">Candidate tool</tspan></text><text class="nodeBody" x="607" y="394"><tspan x="607" dy="0">SAGE decides whether to generate</tspan><tspan x="607" dy="22">helper code, schema, triggers,</tspan><tspan x="607" dy="22">and abstention logic.</tspan></text><rect x="1285" y="290" width="380" height="155" rx="18" fill="#ffffff" stroke="#d97706" stroke-width="2" filter="url(#softShadow)"/><rect x="1285" y="290" width="380" height="54" rx="18" fill="#fff4de"/><rect x="1285" y="290" width="8" height="155" rx="4" fill="#d97706"/><circle cx="1329" cy="332" r="28" fill="#d97706"/><text class="num" x="1329" y="340" text-anchor="middle">3</text><text class="eyebrow" x="1371" y="320" fill="#d97706">VALIDATE</text><text class="nodeTitle" x="1371" y="348"><tspan x="1371" dy="0">Gate before use</tspan></text><text class="nodeBody" x="1317" y="394"><tspan x="1317" dy="0">Contract, static safety,</tspan><tspan x="1317" dy="22">callability, negative cases, and</tspan><tspan x="1317" dy="22">smoke traces must pass.</tspan></text><rect x="1680" y="520" width="380" height="155" rx="18" fill="#ffffff" stroke="#7c3aed" stroke-width="2" filter="url(#softShadow)"/><rect x="1680" y="520" width="380" height="54" rx="18" fill="#f2edff"/><rect x="1680" y="520" width="8" height="155" rx="4" fill="#7c3aed"/><circle cx="1724" cy="562" r="28" fill="#7c3aed"/><text class="num" x="1724" y="570" text-anchor="middle">4</text><text class="eyebrow" x="1766" y="550" fill="#7c3aed">REGISTER + ROUTE</text><text class="nodeTitle" x="1766" y="578"><tspan x="1766" dy="0">Bounded bundle</tspan></text><text class="nodeBody" x="1712" y="624"><tspan x="1712" dy="0">Accepted tools enter inventory and</tspan><tspan x="1712" dy="22">only relevant tools are routed at</tspan><tspan x="1712" dy="22">runtime.</tspan></text><rect x="895" y="820" width="430" height="155" rx="18" fill="#ffffff" stroke="#dc2626" stroke-width="2" filter="url(#softShadow)"/><rect x="895" y="820" width="430" height="54" rx="18" fill="#fff1f1"/><rect x="895" y="820" width="8" height="155" rx="4" fill="#dc2626"/><circle cx="939" cy="862" r="28" fill="#dc2626"/><text class="num" x="939" y="870" text-anchor="middle">5</text><text class="eyebrow" x="981" y="850" fill="#dc2626">USE + LEARN</text><text class="nodeTitle" x="981" y="878"><tspan x="981" dy="0">Natural actor use</tspan></text><text class="nodeBody" x="927" y="924"><tspan x="927" dy="0">The actor may call routed tools; SAGE</tspan><tspan x="927" dy="22">logs calls, failures, outcomes, and</tspan><tspan x="927" dy="22">side effects.</tspan></text><rect x="805" y="560" width="610" height="210" rx="26" fill="#ffffff" stroke="#059669" stroke-width="2.3" filter="url(#hubGlow)"/><rect x="833" y="588" width="554" height="154" rx="20" fill="#e8f8f1" stroke="#059669" stroke-width="1.2"/><circle cx="903" cy="664" r="48" fill="#059669"/><text class="num" x="903" y="672" text-anchor="middle">+</text><text class="hubTitle" x="985" y="635">Validated tool inventory</text><text class="hubBody" x="985" y="672"><tspan x="985" dy="0">Accepted tools persist with proof, code hash,</tspan><tspan x="985" dy="24">triggers, and lifecycle state.</tspan></text><rect x="985" y="718" width="230" height="38" rx="19" fill="#e8f8f1" stroke="#059669" stroke-width="1.3"/><text class="badge" x="1100.0" y="743" text-anchor="middle" fill="#059669">current proof required</text><path d="M520 538 C550 420 585 365 610 350" fill="none" stroke="#059669" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="1.0" marker-end="url(#green-arrow)"/><path d="M935 365 C1080 285 1190 285 1285 350" fill="none" stroke="#059669" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="1.0" marker-end="url(#green-arrow)"/><path d="M1665 365 C1755 405 1815 465 1855 520" fill="none" stroke="#7c3aed" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="1.0" marker-end="url(#violet-arrow)"/><path d="M1880 675 C1745 850 1505 940 1325 900" fill="none" stroke="#dc2626" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="1.0" marker-end="url(#red-arrow)"/><path d="M895 895 C640 965 310 835 260 675" fill="none" stroke="#2563eb" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="1.0" marker-end="url(#blue-arrow)"/><path d="M1475 430 C1450 510 1410 555 1350 585" fill="none" stroke="#059669" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="1.0" marker-end="url(#green-arrow)"/><path d="M1415 665 C1515 650 1600 620 1680 598" fill="none" stroke="#7c3aed" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="1.0" marker-end="url(#violet-arrow)"/><path d="M990 820 C980 790 978 770 985 745" fill="none" stroke="#dc2626" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="1.0" marker-end="url(#red-arrow)"/><rect x="1124" y="486" width="190" height="38" rx="19" fill="#fff4de" stroke="#d97706" stroke-width="1.3"/><text class="badge" x="1219.0" y="511" text-anchor="middle" fill="#d97706">repair or reject</text><path d="M1395 445 C1320 495 1250 505 1218 505" fill="none" stroke="#d97706" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" opacity="1.0" stroke-dasharray="8 8" marker-end="url(#amber-arrow)"/><path d="M1124 505 C960 520 820 455 760 445" fill="none" stroke="#d97706" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" opacity="1.0" stroke-dasharray="8 8" marker-end="url(#amber-arrow)"/><rect x="208" y="705" width="230" height="38" rx="19" fill="#eaf3ff" stroke="#2563eb" stroke-width="1.3"/><text class="badge" x="323.0" y="730" text-anchor="middle" fill="#2563eb">visible evidence only</text><rect x="635" y="205" width="230" height="38" rx="19" fill="#e8f8f1" stroke="#059669" stroke-width="1.3"/><text class="badge" x="750.0" y="230" text-anchor="middle" fill="#059669">birth is conditional</text><rect x="1390" y="205" width="230" height="38" rx="19" fill="#fff4de" stroke="#d97706" stroke-width="1.3"/><text class="badge" x="1505.0" y="230" text-anchor="middle" fill="#d97706">proof before routing</text><rect x="1756" y="705" width="210" height="38" rx="19" fill="#f2edff" stroke="#7c3aed" stroke-width="1.3"/><text class="badge" x="1861.0" y="730" text-anchor="middle" fill="#7c3aed">bounded routing</text><rect x="1000" y="1000" width="230" height="38" rx="19" fill="#fff1f1" stroke="#dc2626" stroke-width="1.3"/><text class="badge" x="1115.0" y="1025" text-anchor="middle" fill="#dc2626">side effects audited</text><path d="M1110 975 V1040" fill="none" stroke="#dc2626" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="1.0" marker-end="url(#red-arrow)"/><rect x="104" y="1040" width="2192" height="280" rx="24" fill="#f1f5f9" stroke="#d9e2ec" stroke-width="1.5"/><text class="eyebrow" x="140" y="1082" fill="#64748b">LIFECYCLE GOVERNANCE</text><rect x="150" y="1132" width="360" height="108" rx="14" fill="#ffffff" stroke="#dc2626" stroke-width="1.7"/><rect x="150" y="1132" width="8" height="108" rx="4" fill="#dc2626"/><text class="nodeTitle" x="184" y="1170">Reflection</text><text class="nodeBody" x="184" y="1200"><tspan x="184" dy="0">Review reuse, regressions, utility,</tspan><tspan x="184" dy="21">and side effects.</tspan></text><rect x="610" y="1095" width="150" height="38" rx="19" fill="#e8f8f1" stroke="#059669" stroke-width="1.3"/><text class="badge" x="685.0" y="1120" text-anchor="middle" fill="#059669">retain</text><rect x="610" y="1165" width="150" height="38" rx="19" fill="#fff4de" stroke="#d97706" stroke-width="1.3"/><text class="badge" x="685.0" y="1190" text-anchor="middle" fill="#d97706">repair</text><rect x="610" y="1235" width="150" height="38" rx="19" fill="#fff1f1" stroke="#dc2626" stroke-width="1.3"/><text class="badge" x="685.0" y="1260" text-anchor="middle" fill="#dc2626">retire</text><rect x="900" y="1088" width="400" height="94" rx="16" fill="#ffffff" stroke="#059669" stroke-width="1.5"/><text class="nodeTitle" x="934" y="1128">Maintain</text><text class="nodeBody" x="934" y="1156"><tspan x="934" dy="0">Eligible tools stay available for future</tspan><tspan x="934" dy="21">routing.</tspan></text><rect x="900" y="1210" width="400" height="78" rx="16" fill="#fff4de" stroke="#d97706" stroke-width="1.5"/><text class="nodeTitle" x="934" y="1244">Repair loop</text><text class="small" x="1084" y="1244">Update candidate, triggers, or tests.</text><rect x="1535" y="1150" width="410" height="96" rx="16" fill="#fff1f1" stroke="#dc2626" stroke-width="1.5"/><text class="nodeTitle" x="1570" y="1190">Suppress</text><text class="nodeBody" x="1570" y="1218"><tspan x="1570" dy="0">Unsafe or low-value tools are hidden,</tspan><tspan x="1570" dy="21">parked, or retired.</tspan></text><path d="M510 1186 L610 1114" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="1.0" marker-end="url(#slate-arrow)"/><path d="M510 1186 L610 1184" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="1.0" marker-end="url(#slate-arrow)"/><path d="M510 1186 L610 1254" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="1.0" marker-end="url(#slate-arrow)"/><path d="M760 1114 L900 1135" fill="none" stroke="#059669" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="1.0" marker-end="url(#green-arrow)"/><path d="M760 1184 L900 1248" fill="none" stroke="#d97706" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="1.0" stroke-dasharray="9 8" marker-end="url(#amber-arrow)"/><path d="M760 1254 H1535 V1198" fill="none" stroke="#dc2626" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="1.0" stroke-dasharray="9 8" marker-end="url(#red-arrow)"/><rect x="910" y="1324" width="220" height="38" rx="19" fill="#e8f8f1" stroke="#059669" stroke-width="1.3"/><text class="badge" x="1020.0" y="1349" text-anchor="middle" fill="#059669">retain: future routing</text><rect x="1160" y="1324" width="235" height="38" rx="19" fill="#fff4de" stroke="#d97706" stroke-width="1.3"/><text class="badge" x="1277.5" y="1349" text-anchor="middle" fill="#d97706">repair: return to gates</text><rect x="100" y="1370" width="2200" height="44" rx="12" fill="#111827"/><text class="footerStrong" x="134" y="1399">Paper boundary:</text><text class="footerText" x="270" y="1399">generated tools use visible context, pass validation before routing, preserve native side-effect tools, and remain subject to lifecycle repair or retirement.</text>
</svg>
