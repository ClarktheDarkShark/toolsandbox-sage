repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [ '--unsafe' ] # checks syntax without loading yaml
      - id: check-added-large-files
        # This credential-scanned, content-pinned fixture is a deliberate
        # publication input. All other added files retain the default limit.
        exclude: ^artifacts/publication_cleanup_20260901/fixtures/rapid_api_cache\.sanitized\.json$
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.15.12
    hooks:
      # Run the linter.
      - id: ruff
        args: [ --fix ]
        exclude: \.ipynb$
      # Run the formatter.
      - id: ruff-format
        exclude: \.ipynb$
  - repo: local
    hooks:
      - id: sage-secret-scan
        name: SAGE secret scan
        entry: python scripts/check_no_secrets.py
        language: python
        pass_filenames: true
        require_serial: true
  - repo: local
    # Getting mypy to work in pre-commit have always been tricky
    # pre-commit/mirrors-mypy isn't good enough since its env and config
    # could differ with local environment, leading to unexpected behavior.
    # Here we use the mypy installed in local env instead
    hooks:
      - id: mypy
        name: mypy
        entry: mypy
        language: system
        args: [--follow-imports=silent]
        # The inherited repository is not globally mypy-clean. Enforce strict
        # typing on the publication control plane added by this release rather
        # than advertising a gate that always fails on unrelated legacy code.
        files: ^(scripts/(run_chapter4_evidence_campaign|run_sage_protocol|verify_publication_(environment|inputs|run|sample))\.py|tests/unit/test_publication_(campaign|environment|inputs|run_verifier|sample_verifier)\.py)$
        types: [ python ]
        require_serial: true
        verbose: true
