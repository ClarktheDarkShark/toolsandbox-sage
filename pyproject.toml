[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0", "packaging==26.3"]
build-backend = "setuptools.build_meta"

[project]
name = "toolsandbox-sage"
version = "0.1.0"
description = "Research implementation of self-evolving tool use on ToolSandbox"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license-files = ["LICENSE", "NOTICE.md", "ACKNOWLEDGEMENTS"]
authors = [
    { name = "Christopher Clark" },
]
keywords = [
    "agent evaluation",
    "research",
    "self-evolving agents",
    "tool use",
    "ToolSandbox",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "attrs==26.1.0",
    "ccy==2.0.0",
    "decorator==5.1.1",
    "dill==0.4.1",
    "geopy==2.4.1",
    "holidays==0.95",
    "httpx==0.28.1",
    "langchain-core==0.2.43",
    "networkx==3.3",
    "numpy==1.26.4",
    "openai==2.37.0",
    "phonenumbers==9.0.29",
    "pint==0.25.3",
    "polars==0.20.31",
    "pydantic==2.13.4",
    "rapidfuzz==3.13.0",
    "requests==2.33.1",
    "rouge-score==0.1.2",
    "scipy==1.13.1",
    "StrEnum==0.4.15",
    "tenacity==8.5.0",
    "tqdm==4.67.3",
    "typing-extensions==4.15.0",
]

[project.scripts]
tool_sandbox = "tool_sandbox.cli:main"
sage-protocol = "scripts.run_sage_protocol:main"
sage-dashboard = "sage_ts.dashboard.server:main"
sage-build-chapter4-evolution = "scripts.build_chapter4_evolution_dashboard:main"

[project.urls]
Homepage = "https://github.com/ClarktheDarkShark/toolsandbox-sage"
Repository = "https://github.com/ClarktheDarkShark/toolsandbox-sage"
Issues = "https://github.com/ClarktheDarkShark/toolsandbox-sage/issues"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = [".", "src"]
include = ["tool_sandbox*", "sage_ts*", "scripts*"]
exclude = [
    "artifacts*",
    "cybergym_data*",
    "docs*",
    "external*",
    "figures*",
    "language-life-game*",
    "memory*",
    "outputs*",
    "src*",
    "tests*",
]
namespaces = false

[tool.setuptools.package-data]
"sage_ts.dashboard" = ["*.html"]
"scripts.research" = ["chapter4_evidence_template.html"]
