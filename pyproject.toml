[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "toolsandbox-sage"
version = "0.1.0"
description = "Research implementation of self-evolving tool use on ToolSandbox"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license-files = ["LICENSE", "NOTICE.md", "ACKNOWLEDGEMENTS"]
authors = [
    { name = "Christopher Clark" },
]
keywords = [
    "agent evaluation",
    "research",
    "self-evolving agents",
    "tool use",
    "ToolSandbox",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "attrs==26.1.0",
    "ccy==2.0.0",
    "decorator==5.1.1",
    "dill==0.4.1",
    "geopy==2.4.1",
    "holidays==0.95",
    "httpx==0.28.1",
    "langchain-core==0.2.43",
    "networkx==3.3",
    "numpy==1.26.4",
    "openai==2.37.0",
    "phonenumbers==9.0.29",
    "Pillow==11.3.0",
    "pint==0.25.3",
    "polars==0.20.31",
    "pydantic==2.13.4",
    "rapidfuzz==3.13.0",
    "requests==2.33.1",
    "rouge-score==0.1.2",
    "scipy==1.13.1",
    "StrEnum==0.4.15",
    "tenacity==8.5.0",
    "tqdm==4.67.3",
    "typing-extensions==4.15.0",
]

[project.optional-dependencies]
dev = [
    "build==1.2.2.post1",
    "mypy==1.11.2",
    "pre-commit==4.0.1",
    "pytest==7.4.4",
    "pytest-cov>=5,<7",
    "ruff==0.15.13",
]

[project.scripts]
tool_sandbox = "tool_sandbox.cli:main"
sage-protocol = "scripts.run_sage_protocol:main"
sage-campaign = "scripts.run_chapter4_evidence_campaign:main"
sage-dashboard = "sage_ts.dashboard.server:main"
sage-build-chapter4-evolution = "scripts.build_chapter4_evolution_dashboard:main"
sage-render-chapter4-evolution = "scripts.render_chapter4_evolution_tables:main"

[project.urls]
Homepage = "https://github.com/ClarktheDarkShark/toolsandbox-sage"
Repository = "https://github.com/ClarktheDarkShark/toolsandbox-sage"
Issues = "https://github.com/ClarktheDarkShark/toolsandbox-sage/issues"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = [".", "src"]
include = ["tool_sandbox*", "sage_ts*", "scripts*"]
exclude = [
    "artifacts*",
    "cybergym_data*",
    "docs*",
    "external*",
    "figures*",
    "language-life-game*",
    "memory*",
    "outputs*",
    "src*",
    "tests*",
]
namespaces = false

[tool.setuptools.package-data]
"sage_ts.dashboard" = ["*.html"]
"scripts.research" = ["chapter4_evidence_template.html"]

[tool.pytest.ini_options]
addopts = ""
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
extend-select = ["I"]
ignore = ["F841"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[[tool.mypy.overrides]]
module = ["holidays", "polars", "rouge_score", "rouge_score.*", "tqdm", "tqdm.*"]
ignore_missing_imports = true

[tool.mypy]
mypy_path = "src"
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_untyped_defs = true
extra_checks = true
implicit_reexport = false
strict_equality = true
warn_unused_configs = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_ignores = true
